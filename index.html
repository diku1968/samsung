<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Art Scanner - Turn Anything into Art</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #000;
            color: #0ff;
            font-family: monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        #status {
            padding: 12px;
            font-size: 12px;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid #0ff;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .main-container {
            margin-top: 50px;
            padding: 10px;
        }
        
        .viewer {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #0ff;
        }
        
        .viewer-title {
            background: rgba(0,255,255,0.1);
            padding: 8px;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid #0ff;
        }
        
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
        
        video {
            transform: scaleX(-1);
        }
        
        canvas {
            transform: scaleX(-1);
        }
        
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            border-top: 1px solid #0ff;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        button {
            background: linear-gradient(135deg, #0ff, #00f);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(0,255,255,0.3);
            font-size: 14px;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .art-style-badge {
            position: fixed;
            top: 60px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            border-left: 3px solid #0ff;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .instruction {
            text-align: center;
            font-size: 11px;
            padding: 10px;
            background: rgba(0,255,255,0.05);
            margin: 10px;
            border-radius: 10px;
        }
        
        @media (min-width: 768px) {
            .split-view {
                display: flex;
                gap: 15px;
            }
            .viewer {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="status">🔍 AI ART SCANNER READY - Point camera at any image</div>
    <div class="art-style-badge" id="style-badge">🎨 STYLE: VAN GOGH</div>
    
    <div class="main-container">
        <div class="split-view">
            <div class="viewer">
                <div class="viewer-title">📷 SCAN IMAGE HERE</div>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            
            <div class="viewer">
                <div class="viewer-title">✨ AI GENERATED ARTWORK</div>
                <canvas id="art-canvas"></canvas>
            </div>
        </div>
        <div class="instruction">
            💡 TIP: Hold any image (photo, painting, magazine) in front of camera → Watch it transform into living artwork!
        </div>
    </div>

    <div class="controls">
        <button onclick="setArtStyle('vangogh')" id="btn-vg">🌃 VAN GOGH</button>
        <button onclick="setArtStyle('munch')" id="btn-munch">😱 MUNCH</button>
        <button onclick="setArtStyle('hokusai')" id="btn-hokusai">🌊 HOKUSAI</button>
        <button onclick="setArtStyle('picasso')" id="btn-picasso">🎨 PICASSO</button>
        <button onclick="setArtStyle('monet')" id="btn-monet">🌸 MONET</button>
        <button onclick="captureArtwork()" id="btn-capture">📸 CAPTURE ARTWORK</button>
    </div>

    <script>
        // AI Art Scanner - Transforms any scanned image into artwork video
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const styleBadge = document.getElementById('style-badge');
        
        let currentStyle = 'vangogh';
        let isProcessing = true;
        let animationId = null;
        let capturedArtworks = [];
        
        // Advanced artistic style transfers
        const artStyles = {
            vangogh: {
                name: 'VAN GOGH',
                emoji: '🌃',
                effect: (r, g, b) => {
                    // Swirling starry night effect
                    let newR = Math.min(255, r * 0.9 + g * 0.3 + 25);
                    let newG = Math.min(255, g * 0.7 + b * 0.4);
                    let newB = Math.min(255, b * 1.2 + 30);
                    
                    // Add swirl texture
                    if (Math.random() > 0.95) {
                        newR = Math.min(255, newR + 40);
                        newG = Math.min(255, newG + 20);
                    }
                    return { r: newR, g: newG, b: newB };
                }
            },
            
            munch: {
                name: 'MUNCH',
                emoji: '😱',
                effect: (r, g, b) => {
                    // The Scream - anxious, intense colors
                    let newR = Math.min(255, r * 1.4 + g * 0.2);
                    let newG = Math.min(255, g * 0.5);
                    let newB = Math.min(255, b * 0.3 + 15);
                    
                    // Wavy distortion effect
                    if (Math.random() > 0.93) {
                        newR = Math.min(255, newR + 60);
                        newG = Math.min(255, newG + 30);
                    }
                    return { r: newR, g: newG, b: newB };
                }
            },
            
            hokusai: {
                name: 'HOKUSAI',
                emoji: '🌊',
                effect: (r, g, b) => {
                    // Great Wave - deep blues and whites
                    let newR = Math.min(255, r * 0.3);
                    let newG = Math.min(255, g * 0.5 + b * 0.6);
                    let newB = Math.min(255, b * 1.2 + 25);
                    
                    // Wave foam effect on bright areas
                    if (g > 120 && b > 120 && Math.random() > 0.94) {
                        newR = 255;
                        newG = 255;
                        newB = 255;
                    }
                    return { r: newR, g: newG, b: newB };
                }
            },
            
            picasso: {
                name: 'PICASSO',
                emoji: '🎨',
                effect: (r, g, b) => {
                    // Cubist effect - fragmented colors
                    const brightness = (r + g + b) / 3;
                    let newR, newG, newB;
                    
                    if (brightness > 128) {
                        newR = Math.min(255, r * 1.3);
                        newG = Math.min(255, g * 0.6);
                        newB = Math.min(255, b * 0.8);
                    } else {
                        newR = Math.min(255, r * 0.5 + 60);
                        newG = Math.min(255, g * 0.4 + 40);
                        newB = Math.min(255, b * 0.6 + 50);
                    }
                    
                    // Random color blocking
                    if (Math.random() > 0.97) {
                        newR = Math.min(255, newR + 80);
                        newG = Math.min(255, newG);
                        newB = Math.min(255, newB + 50);
                    }
                    return { r: newR, g: newG, b: newB };
                }
            },
            
            monet: {
                name: 'MONET',
                emoji: '🌸',
                effect: (r, g, b) => {
                    // Impressionist - soft, dreamy colors
                    let newR = Math.min(255, r * 0.9 + 20);
                    let newG = Math.min(255, g * 0.95 + b * 0.2);
                    let newB = Math.min(255, b * 0.9 + 30);
                    
                    // Soft blur effect via color averaging
                    if (Math.random() > 0.9) {
                        newR = Math.min(255, newR * 0.8 + 40);
                        newG = Math.min(255, newG * 0.85 + 30);
                        newB = Math.min(255, newB * 0.9 + 20);
                    }
                    return { r: newR, g: newG, b: newB };
                }
            }
        };
        
        function setArtStyle(style) {
            currentStyle = style;
            const styleData = artStyles[style];
            styleBadge.innerHTML = `🎨 STYLE: ${styleData.name} ${styleData.emoji}`;
            statusDiv.innerHTML = `🎨 AI ARTIST: ${styleData.name} - Scanning & Transforming...`;
            
            // Visual feedback
            setTimeout(() => {
                statusDiv.innerHTML = `🔍 AI ART SCANNER - Point camera at any image`;
            }, 2000);
            
            // Haptic feedback for mobile
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }
        
        function applyArtEffect(imageData) {
            const data = imageData.data;
            const style = artStyles[currentStyle];
            
            // Process pixels with artistic transformation
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                
                const transformed = style.effect(r, g, b);
                
                data[i] = transformed.r;
                data[i+1] = transformed.g;
                data[i+2] = transformed.b;
            }
            
            return imageData;
        }
        
        // Add artistic brush strokes
        function addBrushStrokes(ctx, width, height) {
            if (Math.random() > 0.85) return;
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // Simulate brush strokes
            for (let i = 0; i < 100; i++) {
                const x = Math.floor(Math.random() * width);
                const y = Math.floor(Math.random() * height);
                const idx = (y * width + x) * 4;
                
                if (Math.random() > 0.7) {
                    data[idx] = Math.min(255, data[idx] + 30);
                    data[idx+1] = Math.min(255, data[idx+1] + 20);
                } else {
                    data[idx] = Math.max(0, data[idx] - 20);
                    data[idx+2] = Math.max(0, data[idx+2] - 20);
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        // Detect edges for sketch-like effect
        function addSketchEffect(ctx, width, height) {
            if (Math.random() > 0.8) return;
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // Simple edge enhancement
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    const idxUp = ((y-1) * width + x) * 4;
                    const idxDown = ((y+1) * width + x) * 4;
                    
                    const diff = Math.abs(data[idx] - data[idxUp]) + Math.abs(data[idx+1] - data[idxDown+1]);
                    
                    if (diff > 50) {
                        data[idx] = Math.max(0, data[idx] - 40);
                        data[idx+1] = Math.max(0, data[idx+1] - 40);
                        data[idx+2] = Math.max(0, data[idx+2] - 40);
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function captureArtwork() {
            // Create a downloadable snapshot of the artwork
            const link = document.createElement('a');
            link.download = `artwork-${artStyles[currentStyle].name}-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
            
            statusDiv.innerHTML = `📸 ARTWORK CAPTURED! Saved as ${artStyles[currentStyle].name} style`;
            setTimeout(() => {
                statusDiv.innerHTML = `🔍 AI ART SCANNER - Point camera at any image`;
            }, 2000);
            
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(100);
            }
        }
        
        function processFrame() {
            if (!isProcessing || video.readyState !== 4 || video.videoWidth === 0) {
                animationId = requestAnimationFrame(processFrame);
                return;
            }
            
            // Match canvas size to video
            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            try {
                // Draw current camera frame (what you're scanning)
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Apply AI art transformation
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                imageData = applyArtEffect(imageData);
                ctx.putImageData(imageData, 0, 0);
                
                // Add artistic finishing touches
                addBrushStrokes(ctx, canvas.width, canvas.height);
                addSketchEffect(ctx, canvas.width, canvas.height);
                
            } catch(e) {
                // Silent fail for frame skips
            }
            
            animationId = requestAnimationFrame(processFrame);
        }
        
        async function initCamera() {
            try {
                statusDiv.innerHTML = "📸 ACCESSING CAMERA - Ready to scan images...";
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                
                video.srcObject = stream;
                
                return new Promise((resolve) => {
                    video.onloadeddata = () => {
                        statusDiv.innerHTML = "✅ SCANNER READY - Point any image at camera to see AI artwork!";
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
                
            } catch(err) {
                statusDiv.innerHTML = "❌ Camera error: " + err.message;
                statusDiv.style.color = "#f00";
                return false;
            }
        }
        
        async function start() {
            const cameraReady = await initCamera();
            if (cameraReady !== false) {
                processFrame();
            }
        }
        
        // Start the AI Art Scanner
        start();
    </script>
</body>
</html>
