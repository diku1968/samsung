<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Video Art Creator</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #000;
            --text: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, #artCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #artCanvas {
            display: none;
            z-index: 10;
        }

        .ui-overlay {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 20;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            text-transform: uppercase;
        }

        .btn:active { transform: scale(0.95); }
        .btn-capture { background: var(--primary); border-color: var(--primary); }
        .hidden { display: none !important; }

        #status {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.7;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="status">Requesting Camera...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="artCanvas"></canvas>
    </div>

    <div class="ui-overlay">
        <button id="captureBtn" class="btn btn-capture">Capture & Create Art</button>
        <button id="resetBtn" class="btn hidden">Reset Camera</button>
    </div>

    <canvas id="bufferCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const artCanvas = document.getElementById('artCanvas');
        const bufferCanvas = document.getElementById('bufferCanvas');
        const captureBtn = document.getElementById('captureBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('status');

        const ctx = artCanvas.getContext('2d');
        const bufferCtx = bufferCanvas.getContext('2d');

        let particles = [];
        let animationId = null;
        let isArtMode = false;

        const PARTICLE_DENSITY = 8; 
        const SPEED_FACTOR = 0.5;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * SPEED_FACTOR;
                this.vy = (Math.random() - 0.5) * SPEED_FACTOR;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += 0.02;
                this.vx += Math.cos(this.angle) * 0.02;
                this.vy += Math.sin(this.angle) * 0.02;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = artCanvas.width;
                if (this.x > artCanvas.width) this.x = 0;
                if (this.y < 0) this.y = artCanvas.height;
                if (this.y > artCanvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                // Important: Ensure video starts playing
                video.onloadedmetadata = () => {
                    video.play();
                    statusText.innerText = "Camera Ready - Point at something colorful!";
                };
            } catch (err) {
                statusText.innerText = "Camera Error: " + err.message;
            }
        }

        function captureImage() {
            if (video.videoWidth === 0) return;

            isArtMode = true;
            statusText.innerText = "Generating Art...";

            artCanvas.width = window.innerWidth;
            artCanvas.height = window.innerHeight;
            bufferCanvas.width = video.videoWidth;
            bufferCanvas.height = video.videoHeight;

            bufferCtx.drawImage(video, 0, 0);
            const imageData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            const data = imageData.data;

            particles = [];
            const scaleX = artCanvas.width / bufferCanvas.width;
            const scaleY = artCanvas.height / bufferCanvas.height;

            for (let y = 0; y < bufferCanvas.height; y += PARTICLE_DENSITY) {
                for (let x = 0; x < bufferCanvas.width; x += PARTICLE_DENSITY) {
                    const index = (y * bufferCanvas.width + x) * 4;
                    if (data[index + 3] > 128) {
                        const color = `rgb(${data[index]},${data[index+1]},${data[index+2]})`;
                        particles.push(new Particle(x * scaleX, y * scaleY, color));
                    }
                }
            }

            video.style.display = 'none';
            artCanvas.style.display = 'block';
            captureBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');

            animate();
        }

        function animate() {
            if (!isArtMode) return;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, artCanvas.width, artCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            animationId = requestAnimationFrame(animate);
        }

        function reset() {
            isArtMode = false;
            cancelAnimationFrame(animationId);
            video.style.display = 'block';
            artCanvas.style.display = 'none';
            captureBtn.classList.remove('hidden');
            resetBtn.classList.add('hidden');
            statusText.innerText = "Camera Active";
        }

        captureBtn.addEventListener('click', captureImage);
        resetBtn.addEventListener('click', reset);
        initCamera();
    </script>
</body>
</html>
