<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S26 Ultra NPU Art Scanner</title>
    <!-- Load TensorFlow.js and Magenta -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@magenta/image@0.2.1/dist/magentaimg.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; overflow-x: hidden; }
        video, canvas { width: 90%; max-width: 500px; border-radius: 15px; margin-top: 10px; border: 2px solid #333; }
        .controls { padding: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .style-thumb { width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; margin: 5px; cursor: pointer; object-fit: cover; }
        .loading { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <h2>AI NPU Art Studio</h2>
    <p id="status" class="loading">Loading AI Models... Please wait.</p>

    <!-- Hidden Style Source (You can change this URL to any art style) -->
    <img id="style-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/300px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" style="display:none;" crossorigin="anonymous">

    <div id="app" style="display:none;">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="art-canvas"></canvas>
        
        <div class="controls">
            <p>Scanning Live Feed & Applying Style</p>
            <button onclick="toggleCamera()">Flip Camera</button>
        </div>
    </div>

    <script>
        let model;
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('art-canvas');
        const styleImg = document.getElementById('style-img');
        const status = document.getElementById('status');
        const app = document.getElementById('app');

        async function init() {
            // Initialize the Style Transfer Model
            model = new mi.ArbitraryStyleTransferNetwork();
            await model.initialize();
            
            status.innerText = "Model Loaded! Starting Camera...";
            
            // Setup Webcam
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = stream;
                status.style.display = "none";
                app.style.display = "block";
                
                // Start the AI Processing Loop
                renderArt();
            } catch (err) {
                status.innerText = "Error accessing camera: " + err;
            }
        }

        async function renderArt() {
            // Every frame, use the NPU to transform the image
            // We use a small size (256) for the internal math to keep it fast
            try {
                await model.stylize(video, styleImg).then((stylized) => {
                    const ctx = canvas.getContext('2d');
                    // Draw the result onto our visible canvas
                    tf.browser.toPixels(stylized, canvas);
                });
            } catch (e) {
                console.error(e);
            }
            
            // Loop the function
            requestAnimationFrame(renderArt);
        }

        function toggleCamera() {
            // Logic to switch between front and back camera
            const currMode = video.srcObject.getVideoTracks()[0].getSettings().facingMode;
            const newMode = currMode === "user" ? "environment" : "user";
            navigator.mediaDevices.getUserMedia({ video: { facingMode: newMode } })
                .then(stream => video.srcObject = stream);
        }

        // Start everything
        init();
    </script>
</body>
</html>
