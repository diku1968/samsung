<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@magenta/image@0.2.1"></script>
    <style>
        body { background: #000; color: #0ff; font-family: monospace; text-align: center; }
        #status { padding: 20px; font-size: 14px; border-bottom: 1px solid #0ff; }
        video, canvas { width: 95%; max-width: 400px; margin-top: 10px; border: 1px solid #0ff; }
    </style>
</head>
<body>
    <div id="status">INITIATING SYSTEM...</div>
    
    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
    <canvas id="art-canvas"></canvas>

    <img id="style-img" src="https://images.metmuseum.org/CRDImages/ep/mobile-large/DP-13139-001.jpg" style="display:none;" crossorigin="anonymous">

    <script>
        const status = document.getElementById('status');
const video = document.getElementById('webcam');
const canvas = document.getElementById('art-canvas');
const styleImg = document.getElementById('style-img');

async function start() {
    try {
        status.innerText = "STEP 1: UNLEASHING GPU...";
        await tf.setBackend('webgl'); 
        await tf.ready();
        
        status.innerText = "STEP 2: LOADING ART BRAIN...";
        const model = new mi.ArbitraryStyleTransferNetwork();
        await model.initialize();

        status.innerText = "STEP 3: OPENING CAMERA...";
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                width: { ideal: 480 }, 
                height: { ideal: 480 }
            } 
        });
        video.srcObject = stream;

        // NEW: Wait for the video to actually have data before starting Step 4
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            status.innerText = "STEP 4: ART ENGINE ACTIVE";
            loop(model);
        };

    } catch (err) {
        status.style.color = "red";
        status.innerText = "CRASH: " + err.message;
        console.error(err);
    }
}

async function loop(model) {
    // Wrap in a try-catch so one bad frame doesn't stop the whole app
    try {
        const result = tf.tidy(() => {
            return model.stylize(video, styleImg);
        });

        const stylized = await result;
        await tf.browser.toPixels(stylized, canvas);
        stylized.dispose(); 
    } catch (e) {
        console.log("Frame skip...");
    }
    
    // S26 Ultra is powerful, 40ms is roughly 25 frames per second
    setTimeout(() => loop(model), 40); 
}

window.onload = start;
    </script>
</body>
</html>
