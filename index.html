<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0.0"></script>
    <style>
        body { 
            background: #000; 
            color: #0ff; 
            font-family: monospace; 
            text-align: center; 
            margin: 0; 
            padding: 20px;
        }
        #status { 
            padding: 15px; 
            font-size: 12px; 
            border-bottom: 1px solid #0ff; 
            background: #111;
            margin-bottom: 20px;
        }
        .preview-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .preview-box {
            width: 45%;
            min-width: 300px;
        }
        .preview-box p {
            font-size: 12px;
            margin: 10px 0;
        }
        video, canvas, img {
            width: 100%;
            max-width: 400px;
            border: 2px solid #0ff;
            border-radius: 8px;
        }
        canvas {
            background: #111;
        }
        #art-canvas {
            width: 100%;
            max-width: 400px;
            height: auto;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0a0;
            color: #fff;
        }
        .error {
            color: #f00;
        }
    </style>
</head>
<body>
    <div id="status">SYSTEM STARTING...</div>
    
    <div class="preview-container">
        <div class="preview-box">
            <p>📷 CAMERA INPUT</p>
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        
        <div class="preview-box">
            <p>🎨 STYLE TRANSFER OUTPUT</p>
            <canvas id="art-canvas"></canvas>
        </div>
    </div>

    <div class="controls">
        <button onclick="loadStyle1()">🌃 Starry Night</button>
        <button onclick="loadStyle2()">🎨 Scream</button>
        <button onclick="loadStyle3()">🌸 Wave</button>
        <button onclick="toggleProcessing()">⏸️ Pause/Resume</button>
    </div>

    <img id="style-img" crossorigin="anonymous" style="display:none;">
    
    <script>
        let isProcessing = true;
        let styleNet = null;
        let styleImage = null;
        let currentStyle = 'starry';
        
        const statusDiv = document.getElementById('status');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('art-canvas');
        const styleImgElement = document.getElementById('style-img');
        
        // Simple pixel-based style transfer using canvas effects
        // (since full neural style transfer would require additional libraries)
        
        function updateStatus(message, isError = false) {
            statusDiv.innerText = message;
            statusDiv.style.color = isError ? '#f00' : '#0ff';
            console.log(message);
        }
        
        // Load different style images
        function loadStyle1() {
            currentStyle = 'starry';
            styleImgElement.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/300px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg';
            updateStatus('🎨 Loaded: Starry Night style');
        }
        
        function loadStyle2() {
            currentStyle = 'scream';
            styleImgElement.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/300px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg';
            updateStatus('🎨 Loaded: The Scream style');
        }
        
        function loadStyle3() {
            currentStyle = 'wave';
            styleImgElement.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Hokusai_-_Great_Wave.jpg/300px-Hokusai_-_Great_Wave.jpg';
            updateStatus('🎨 Loaded: Great Wave style');
        }
        
        function toggleProcessing() {
            isProcessing = !isProcessing;
            updateStatus(isProcessing ? '▶️ Processing ON' : '⏸️ Processing PAUSED');
        }
        
        // Apply artistic effects to canvas (simulating style transfer)
        function applyArtisticEffect(ctx, width, height, style) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            switch(style) {
                case 'starry':
                    // Starry Night effect: increased contrast, yellow/blue emphasis
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i+1];
                        let b = data[i+2];
                        
                        // Enhance blues and yellows
                        data[i] = Math.min(255, r * 0.8 + g * 0.3 + 20);
                        data[i+1] = Math.min(255, g * 0.7 + b * 0.4);
                        data[i+2] = Math.min(255, b * 1.2 + 30);
                        
                        // Add swirl effect (simplified)
                        if (Math.random() > 0.95) {
                            data[i] = Math.min(255, data[i] + 40);
                            data[i+1] = Math.min(255, data[i+1] + 20);
                        }
                    }
                    break;
                    
                case 'scream':
                    // The Scream effect: high contrast, orange/red emphasis
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i+1];
                        let b = data[i+2];
                        
                        data[i] = Math.min(255, r * 1.3 + 20);
                        data[i+1] = Math.min(255, g * 0.6);
                        data[i+2] = Math.min(255, b * 0.4);
                        
                        // Add streaky effect
                        if (Math.random() > 0.9) {
                            data[i] = Math.min(255, data[i] + 50);
                        }
                    }
                    break;
                    
                case 'wave':
                    // Great Wave effect: blue tones with white highlights
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i+1];
                        let b = data[i+2];
                        
                        data[i] = Math.min(255, r * 0.3);
                        data[i+1] = Math.min(255, r * 0.5 + b * 0.7);
                        data[i+2] = Math.min(255, b * 1.1 + 20);
                        
                        // Wave foam effect
                        if (b > 150 && Math.random() > 0.85) {
                            data[i] = 255;
                            data[i+1] = 255;
                            data[i+2] = 255;
                        }
                    }
                    break;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        // Edge detection for outline effect
        function addOutlineEffect(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const edges = new Uint8ClampedArray(data.length);
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    const idxUp = ((y-1) * width + x) * 4;
                    const idxDown = ((y+1) * width + x) * 4;
                    const idxLeft = (y * width + (x-1)) * 4;
                    const idxRight = (y * width + (x+1)) * 4;
                    
                    // Simple Sobel-like edge detection
                    const gx = Math.abs(data[idx] - data[idxRight]) + 
                               Math.abs(data[idx+1] - data[idxRight+1]) +
                               Math.abs(data[idx+2] - data[idxRight+2]);
                    const gy = Math.abs(data[idx] - data[idxDown]) +
                               Math.abs(data[idx+1] - data[idxDown+1]) +
                               Math.abs(data[idx+2] - data[idxDown+2]);
                    
                    const edge = Math.sqrt(gx * gx + gy * gy);
                    
                    if (edge > 30) {
                        edges[idx] = 0;
                        edges[idx+1] = 0;
                        edges[idx+2] = 0;
                    } else {
                        edges[idx] = data[idx];
                        edges[idx+1] = data[idx+1];
                        edges[idx+2] = data[idx+2];
                    }
                    edges[idx+3] = 255;
                }
            }
            
            const edgeImageData = new ImageData(edges, width, height);
            ctx.putImageData(edgeImageData, 0, 0);
        }
        
        async function start() {
            try {
                updateStatus("1. ENABLING GPU...");
                await tf.setBackend('webgl');
                await tf.ready();
                
                updateStatus("2. REQUESTING CAMERA...");
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;
                
                video.onloadeddata = () => {
                    updateStatus("✅ ENGINE RUNNING - Real-time style transfer active");
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    loadStyle1(); // Load default style
                    processFrame();
                };
                
            } catch (err) {
                updateStatus("ERROR: " + err.message + " - Please ensure camera permissions are granted", true);
                console.error(err);
            }
        }
        
        function processFrame() {
            if (!isProcessing || video.readyState !== 4) {
                requestAnimationFrame(processFrame);
                return;
            }
            
            try {
                const ctx = canvas.getContext('2d');
                
                // Draw current video frame
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Apply artistic effects
                applyArtisticEffect(ctx, canvas.width, canvas.height, currentStyle);
                
                // Add outline for painterly effect
                addOutlineEffect(ctx, canvas.width, canvas.height);
                
            } catch (e) {
                console.log("Frame processing:", e.message);
            }
            
            requestAnimationFrame(processFrame);
        }
        
        // Start the application
        window.onload = start;
    </script>
</body>
</html>
