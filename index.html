<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      #scanning-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: white; background: rgba(0,0,0,0.5); z-index: 10; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="scanning-overlay">SCAN ANY PAINTING...</div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 2" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid-1" src="vid1.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        
        <video id="vid-2" src="vid2.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        
        <video id="vid-3" src="vid3.mp4" loop="true" crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid-1" width="1" height="1.5" position="0 0 0" 
                 material="shader: chroma-key; color: 0 1 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#vid-2" width="1.5" height="1" position="0 0 0" 
                 material="shader: chroma-key; color: 0 1 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#vid-3" width="1" height="1" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      // ઓટોમેટિક વીડિયો પ્લે કરવા માટેનો લોજિક
      const drummersVid = document.querySelector('#vid-1');
      const seaVid = document.querySelector('#vid-2');
      const art3Vid = document.querySelector('#vid-3');

      // જ્યારે ટાર્ગેટ દેખાય ત્યારે વીડિયો પ્લે થશે
      document.querySelector('[mindar-image-target="targetIndex: 0"]').addEventListener("targetFound", event => {
        drummersVid.play();
        document.getElementById('scanning-overlay').style.display = "none";
      });

      document.querySelector('[mindar-image-target="targetIndex: 1"]').addEventListener("targetFound", event => {
        seaVid.play();
        document.getElementById('scanning-overlay').style.display = "none";
      });
    </script>
  </body>
</html>
