<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        
        /* Start Button Styling */
        #ui { position: absolute; z-index: 1000; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        #startButton { padding: 20px 40px; font-size: 18px; color: white; background: #007bff; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        /* Scanning UI */
        #scanning-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; color: white; background: rgba(0,0,0,0.5); z-index: 10; pointer-events: none; }
    </style>
</head>

<body>
    <div id="ui">
        <button id="startButton">START AR CAMERA</button>
    </div>

    <div id="scanning-overlay">SCAN ANY PAINTING...</div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: #scanning-overlay" 
        embedded color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid-1" src="vid1.mp4" loop="true" crossorigin="anonymous" playsinline></video>
            <video id="vid-2" src="vid2.mp4" loop="true" crossorigin="anonymous" playsinline></video>
            <video id="vid-3" src="vid3.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target0" mindar-image-target="targetIndex: 0">
            <a-video src="#vid-1" width="1" height="1.5" position="0 0 0"></a-video>
        </a-entity>

        <a-entity id="target1" mindar-image-target="targetIndex: 1">
            <a-video src="#vid-2" width="1.5" height="1" position="0 0 0"></a-video>
        </a-entity>

        <a-entity id="target2" mindar-image-target="targetIndex: 2">
            <a-video src="#vid-3" width="1" height="1" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.getElementById('startButton');
        const ui = document.getElementById('ui');
        const overlay = document.getElementById('scanning-overlay');
        const sceneEl = document.querySelector('a-scene');

        startButton.addEventListener('click', () => {
            // Start the AR System
            const { systems } = sceneEl;
            systems['mindar-image-system'].start();
            
            // Hide UI and show scanning overlay
            ui.style.display = "none";
            overlay.style.display = "flex";
            
            // Pre-warm the videos for Android/Samsung
            document.querySelectorAll('video').forEach(v => {
                v.play();
                v.pause();
            });
        });

        // Auto-play video when painting is found
        document.getElementById('target0').addEventListener("targetFound", () => {
            document.querySelector('#vid-1').play();
            overlay.style.display = "none";
        });

        document.getElementById('target1').addEventListener("targetFound", () => {
            document.querySelector('#vid-2').play();
            overlay.style.display = "none";
        });

        document.getElementById('target2').addEventListener("targetFound", () => {
            document.querySelector('#vid-3').play();
            overlay.style.display = "none";
        });
    </script>
</body>
</html>
