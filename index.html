<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S26 Ultra AR Player</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            color: white; font-family: sans-serif; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">Scanning for your image target...</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- IMPORTANT: Change 'video.mp4' to your video file name -->
            <video id="vid" src="./video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="1" height="0.6" position="0 0 0" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const targetEl = document.querySelector('#target');
        const videoEl = document.querySelector('#vid');
        const infoEl = document.querySelector('#info');

        targetEl.addEventListener("targetFound", () => {
            infoEl.innerText = "Target Found - Playing";
            videoEl.play();
        });

        targetEl.addEventListener("targetLost", () => {
            infoEl.innerText = "Scanning for image...";
            videoEl.pause();
        });

        window.addEventListener('click', () => {
            videoEl.muted = false;
        });
    </script>
</body>
</html>
