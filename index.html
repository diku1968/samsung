<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>AR Video Tracker</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    body {
      position: relative;
    }

    #loading {
      position: fixed;
      z-index: 9999;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial;
      font-size: 20px;
    }

    canvas {
      position: fixed !important;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>

<div id="loading">
  Loading Camera...
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
  embedded
  color-space="sRGB"
  renderer="physicallyCorrectLights: true; colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>
    <video
      id="myvideo"
      src="./video.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-video
      src="#myvideo"
      position="0 0 0"
      width="1"
      height="1.7"
    >
    </a-video>

  </a-entity>

</a-scene>

<script>
  const video = document.querySelector("#myvideo");
  const target = document.querySelector("[mindar-image-target]");
  const loading = document.querySelector("#loading");

  // Camera ready
  document.querySelector("a-scene").addEventListener("loaded", () => {
    loading.innerHTML = "Point Camera To Image";
  });

  // Target found
  target.addEventListener("targetFound", async () => {
    console.log("FOUND");

    loading.style.display = "none";

    try {
      await video.play();
    } catch (e) {
      console.log(e);
    }
  });

  // Target lost
  target.addEventListener("targetLost", () => {
    console.log("LOST");

    video.pause();
  });
</script>

</body>
</html>
