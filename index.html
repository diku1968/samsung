<!DOCTYPE html>
<html>
  <head>
    <title>AR Visiting Card Test</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
      
      <a-assets>
        <!-- Test ke liye koi bhi mp4 video link yahan dalein -->
        <video id="testVideo" src="pvideo.mp4" 
               preload="auto" loop="true" crossorigin="anonymous" 
               playsinline webkit-playsinline>
        </video>
      </a-assets>

      <!-- Aapki .patt file yahan connect hogi -->
      <a-marker type="pattern" url="pattern-marker (1).patt">
        <!-- Line 22 ko isse badal dein -->
<a-video src="#testVideo" 
         width="1.5" height="1" 
         position="0 0.1 0" 
         rotation="-90 0 0"
         play-on-click> <!-- Yeh attribute add karein -->
</a-video>
</a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('click', function () {
        document.querySelector('#testVideo').play();
      });
    </script>
  </body>
</html>
